name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-14
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Select Xcode 16.2
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer

      - name: Show Swift version
        run: swift --version

      - name: Run deterministic self-tests
        run: ./scripts/test.sh --self-tests-only

      - name: Build Swift package
        run: swift build

      - name: Build local app bundle
        run: ./scripts/build-app.sh release

      - name: Verify app signature
        run: codesign --verify --deep --strict "dist/Codex Current.app"
