name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-14
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Run deterministic checks
        run: ./scripts/test.sh

      - name: Build local app bundle
        run: ./scripts/build-app.sh release

      - name: Verify app signature
        run: codesign --verify --deep --strict "dist/Codex Current.app"
